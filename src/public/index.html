<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>everyRoute - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    lucide.createIcons();

    const sections = {
      'endpoint': { title: 'Endpoint', sub: 'API endpoint configuration' },
      'providers': { title: 'Providers', sub: 'Configure upstream AI providers' },
      'combo': { title: 'Combo & Vision', sub: 'Routing logic and image processing' },
      'usage': { title: 'Usage Analytics', sub: 'View consumption' },
      'quota': { title: 'Quota Tracker', sub: 'Manage API limits' },
      'token': { title: 'Token Saver', sub: 'Semantic caching configurations' },
      'cli': { title: 'CLI Tools', sub: 'Command line utilities' },
      'media': { title: 'Media Providers', sub: 'Image generation setups' },
      'proxy': { title: 'Proxy Pools', sub: 'IP rotation configuration' },
      'skills': { title: 'Skills (Tools)', sub: 'Register external APIs for the AI' },
      'console': { title: 'Console Log', sub: 'Live system output' },
      'appearance': { title: 'Appearance', sub: 'Customize dashboard colors' }
    };

    function switchTab(tabId) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById('nav-' + tabId)?.classList.add('active');

      document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
      document.getElementById('section-' + tabId)?.classList.add('active');

      if (sections[tabId]) {
        document.getElementById('header-title').innerText = sections[tabId].title;
        document.getElementById('header-subtitle').innerText = sections[tabId].sub;
      }
    }

    async function loadKeys() {
      try {
        const res = await fetch('/api/keys');
        const keys = await res.json();
        const container = document.getElementById('unified-keys-list');

        if (keys.length === 0) {
          container.innerHTML = '<div class="text-textMuted italic text-sm py-2">No API keys created yet.</div>';
          return;
        }

        container.innerHTML = keys.map(k => `
          <div class="flex items-center justify-between bg-bgInput border border-borderDark rounded-lg p-4 group hover:border-accentOrange/50 transition-colors">
            <div>
              <div class="font-bold text-white">${k.name}</div>
              <div class="text-xs font-mono text-textMuted mt-1">${k.key}</div>
            </div>
            <div class="flex items-center gap-2">
               <button class="bg-bgHover border border-borderDark p-2 rounded-lg text-textMuted hover:text-white transition" title="Copy Key">
                 <i data-lucide="copy" class="w-4 h-4"></i>
               </button>
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (e) {
        console.error("Failed to load keys", e);
      }
    }

    async function createUnifiedKey() {
      const name = prompt('Name for this key:');
      if (!name) return;
      await fetch('/api/keys', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name })
      });
      loadKeys();
    }

    async function saveProvider(e) {
      e.preventDefault();
      await fetch('/api/providers', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          provider_name: document.getElementById('provider-name').value,
          api_key: document.getElementById('provider-key').value,
          base_url: document.getElementById('provider-url').value,
        })
      });
      alert('Provider saved successfully!');
      e.target.reset();
    }

    async function saveTool(e) {
      e.preventDefault();
      await fetch('/api/tools', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          tool_name: document.getElementById('tool-name').value,
          api_key: document.getElementById('tool-key').value,
          base_url: document.getElementById('tool-url').value,
        })
      });
      alert('Tool registered successfully!');
      e.target.reset();
    }

    async function saveCombo(e) {
      e.preventDefault();
      await fetch('/api/combos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          name: document.getElementById('combo-name').value,
          primary_model: document.getElementById('combo-primary').value,
          fallback_model: document.getElementById('combo-fallback').value,
        })
      });
      alert('Combo saved successfully!');
      e.target.reset();
    }

    async function loadUsage() {
      try {
        const res = await fetch('/api/usage');
        const data = await res.json();
        const tbody = document.getElementById('usage-table-body');
        if (data.length === 0) {
           tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-textMuted">No usage recorded yet.</td></tr>';
           return;
        }
        tbody.innerHTML = data.map(r => `
          <tr class="hover:bg-bgHover transition-colors">
            <td class="py-3 px-4 font-medium capitalize text-accentOrange">${r.provider}</td>
            <td class="py-3 px-4 font-mono text-xs">${r.model}</td>
            <td class="py-3 px-4">${r.prompt_tokens.toLocaleString()}</td>
            <td class="py-3 px-4">${r.completion_tokens.toLocaleString()}</td>
            <td class="py-3 px-4 text-right font-medium">$${r.total_cost.toFixed(4)}</td>
          </tr>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function loadConfigs() {
      try {
        const res = await fetch('/api/configs');
        const configs = await res.json();

        // Apply toggles
        document.querySelectorAll('.toggle-btn').forEach(btn => {
           const match = btn.getAttribute('onclick').match(/'(.*?)'/);
           if (!match) return;
           const id = match[1];
           if (configs[id] === 'true') {
              btn.classList.add('bg-accentOrange');
              btn.classList.remove('bg-borderDark');
              btn.children[0].classList.add('translate-x-4');
           }
        });

        // Apply colors
        if (configs['color-bgMain']) applyColor('bgMain', configs['color-bgMain']);
        if (configs['color-bgCard']) applyColor('bgCard', configs['color-bgCard']);
        if (configs['color-accentOrange']) applyColor('accentOrange', configs['color-accentOrange']);

        // Update color pickers to match loaded config
        const bgMainPicker = document.getElementById('color-bgMain');
        if (bgMainPicker && configs['color-bgMain']) bgMainPicker.value = configs['color-bgMain'];

        const bgCardPicker = document.getElementById('color-bgCard');
        if (bgCardPicker && configs['color-bgCard']) bgCardPicker.value = configs['color-bgCard'];

        const accentPicker = document.getElementById('color-accentOrange');
        if (accentPicker && configs['color-accentOrange']) accentPicker.value = configs['color-accentOrange'];

      } catch(e) { console.error(e); }
    }

    async function toggleConfig(key, element) {
      const isEnabled = !element.classList.contains('bg-accentOrange');
      if (isEnabled) {
        element.classList.add('bg-accentOrange');
        element.classList.remove('bg-borderDark');
        element.children[0].classList.add('translate-x-4');
      } else {
        element.classList.remove('bg-accentOrange');
        element.classList.add('bg-borderDark');
        element.children[0].classList.remove('translate-x-4');
      }
      await fetch('/api/configs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ key, value: isEnabled.toString() })
      });
    }

    // Color Customization Logic
    function applyColor(cssVar, hexValue) {
       // Tailwind arbitrary values don't update easily at runtime without rebuilding,
       // but we can inject a style tag to override the classes if needed,
       // or simply update CSS variables if we switch the config to use variables.
       // For this simple implementation, we'll write a dynamic style block.
       let styleEl = document.getElementById('dynamic-theme');
       if (!styleEl) {
         styleEl = document.createElement('style');
         styleEl.id = 'dynamic-theme';
         document.head.appendChild(styleEl);
       }

       // Add the rule to the style block. We'll use CSS specificity to override Tailwind classes.
       let cssRules = styleEl.innerHTML;

       if (cssVar === 'bgMain') {
         cssRules += ` body, .bg-bgMain { background-color: ${hexValue} !important; } `;
       } else if (cssVar === 'bgCard') {
         cssRules += ` .bg-bgCard, .bg-bgSidebar { background-color: ${hexValue} !important; } `;
       } else if (cssVar === 'accentOrange') {
         cssRules += `
           .text-accentOrange { color: ${hexValue} !important; }
           .bg-accentOrange { background-color: ${hexValue} !important; }
           .border-accentOrange { border-color: ${hexValue} !important; }
           .nav-item.active { background-color: ${hexValue}20 !important; color: ${hexValue} !important; }
           .nav-item.active i { color: ${hexValue} !important; }
           ::selection { background-color: ${hexValue} !important; }
         `;
       }
       styleEl.innerHTML = cssRules;
    }

    async function saveColor(cssVar, inputElement) {
       const hexValue = inputElement.value;
       applyColor(cssVar, hexValue);

       // Persist to DB
       await fetch('/api/configs', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ key: 'color-' + cssVar, value: hexValue })
      });
    }


    async function saveMedia(e) {
      e.preventDefault();
      await fetch('/api/media', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          provider_name: document.getElementById('media-name').value,
          api_key: document.getElementById('media-key').value
        })
      });
      alert('Media Provider saved successfully!');
      e.target.reset();
    }

    // Call loaders
    loadKeys();
    loadUsage();
    loadConfigs();
  </script>
</body>
</html>
